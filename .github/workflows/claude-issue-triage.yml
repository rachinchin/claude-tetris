name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowed-tools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh api:*)"
          prompt: |
            Estás analizando el issue #${{ github.event.issue.number }} de este repositorio
            ("${{ github.event.issue.title }}"). Este repo es un Tetris clásico en JavaScript
            vanilla puro (index.html, style.css, game.js, ~300 líneas, sin build ni deps).
            Puntos clave de la arquitectura de game.js, útiles para diagnosticar:
              - `collide(shape, ox, oy)` es la única función que valida límites del tablero y
                solapamiento; la usan movimiento, rotación y el ghost piece.
              - `tryRotate` hace wall kicks probando desplazamientos [0,-1,1,-2,2] columnas.
              - `loop` acumula delta time en `dropAccum` contra `dropInterval` para bajar la pieza.
              - `lockPiece` (merge + clearLines + spawn) fija la pieza al colisionar hacia abajo.
              - `draw`/`drawNext` redibujan todo el canvas cada frame.
              - COLS/ROWS/BLOCK en game.js deben coincidir con width/height del
                `<canvas id="board">` en index.html.

            Tareas:

            1. Ejecuta `gh issue view ${{ github.event.issue.number }} --json title,body,labels,comments`
               para leer el issue completo, sus labels actuales y comentarios existentes.
            2. Si hace falta, revisa el código relevante del checkout (index.html, style.css,
               game.js) para fundamentar el diagnóstico con funciones y líneas concretas.
            3. Etiquetado — usa EXCLUSIVAMENTE esta lista cerrada de labels, que son las únicas
               que existen en el repo (no inventes ni crees otras, no uses `gh label create`):
               bug, documentation, duplicate, enhancement, good first issue, help wanted,
               invalid, question, wontfix.
               Aplica las que correspondan con `gh issue edit ${{ github.event.issue.number }} --add-label "nombre"`.
               No quites labels que ya haya puesto una persona. Si ya están correctas, no
               cambies nada.
            4. Diagnóstico — arma el cuerpo del comentario en español usando **GitHub
               Flavored Markdown** válido (el que GitHub renderiza en comentarios de issue):
               negritas con `**`, listas con `-`, código en línea con backticks y bloques de
               código con triple backtick indicando el lenguaje (```js). Deja una línea en
               blanco entre párrafos y secciones para que GitHub separe los bloques. No uses
               HTML crudo salvo el marcador oculto, ni sintaxis que GitHub no soporte.
               Sigue exactamente este formato, empezando siempre por la línea del marcador
               oculto:

               <!-- claude-triage -->
               **Resumen**: qué pide o reporta el issue, en una frase.

               **Diagnóstico**: causa probable o análisis técnico, citando archivo(s) y
               función(es) concretas (p. ej. `collide()`, `tryRotate()`, `lockPiece()` en
               game.js) cuando aplique.

               **Alcance sugerido**: qué archivos y funciones habría que tocar para
               implementar la solución.

               **Riesgos/dudas**: ambigüedades que convenga aclarar con quien reportó el
               issue antes de implementar.

            5. Publicación — evita duplicar comentarios en ediciones sucesivas del issue:
               a. Busca si ya existe un comentario propio con el marcador, usando:
                  `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments --jq '.[] | select(.body | contains("<!-- claude-triage -->")) | .id'`
               b. Escribe el cuerpo del diagnóstico a un archivo temporal (para evitar
                  problemas de escaping de markdown multilínea en shell).
               c. Si ya existe un id de comentario previo, actualízalo con:
                  `gh api --method PATCH repos/${{ github.repository }}/issues/comments/<id> -f body=@archivo`
                  Si NO existe, créalo con:
                  `gh issue comment ${{ github.event.issue.number }} --body-file archivo`
               Nunca dejes más de un comentario de triage en el mismo issue.

            No modifiques código ni abras pull requests desde este workflow — solo etiqueta y
            comenta el issue.
